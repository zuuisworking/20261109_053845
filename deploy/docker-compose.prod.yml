name: sigap-ulp-labuhan

services:
  mongo:
    # Production requires an operator-approved digest. Mutable tags are not
    # acceptable for a release artifact.
    image: ${MONGO_IMAGE:?MONGO_IMAGE must be pinned to an approved sha256 digest}
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-sigap_ulp_labuhan}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_BACKUP_USERNAME: ${MONGO_BACKUP_USERNAME:?MONGO_BACKUP_USERNAME is required}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD is required}
      MONGO_RESTORE_DATABASE: ${MONGO_RESTORE_DATABASE:-sigap_ulp_labuhan_restore}
      MONGO_RESTORE_USERNAME: ${MONGO_RESTORE_USERNAME:?MONGO_RESTORE_USERNAME is required}
      MONGO_RESTORE_PASSWORD: ${MONGO_RESTORE_PASSWORD:?MONGO_RESTORE_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.getSiblingDB(process.env.MONGO_DATABASE).runCommand({ ping: 1 }).ok' --username \"$$MONGO_APP_USERNAME\" --password \"$$MONGO_APP_PASSWORD\" --authenticationDatabase \"$$MONGO_DATABASE\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks: [data]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must reference an approved sha256 digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${COMPOSE_MONGODB_URI:?COMPOSE_MONGODB_URI is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CLIENT_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      CLIENT_URLS: ${CLIENT_URLS:?CLIENT_URLS is required}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      GOOGLE_FORM_APPS_SCRIPT_URL: ${GOOGLE_FORM_APPS_SCRIPT_URL:-}
      UPLOAD_DIR: /app/storage/uploads
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Export resource guards: output-byte ceiling and concurrent-export cap.
      EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-67108864}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs:
      # The export scratch space holds bounded generated export files; the
      # size covers EXPORT_MAX_BYTES multiplied by EXPORT_MAX_CONCURRENT.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s
    networks: [app, data]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must reference an approved sha256 digest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s
    networks: [app]

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be pinned to an approved sha256 digest}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      # The Caddy image ships busybox wget; curl is used when it is available.
      # The check fails closed when neither client is present.
      test:
        [
          "CMD-SHELL",
          "if command -v wget >/dev/null 2>&1; then wget -q -O /dev/null http://127.0.0.1:8081/healthz; elif command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:8081/healthz >/dev/null; else exit 1; fi",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s
    networks: [app]

networks:
  app:
  data:
    internal: true

volumes:
  mongo_data:
  mongo_config:
  uploads_data:
  caddy_data:
  caddy_config:
