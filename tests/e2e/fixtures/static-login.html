<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGAP login visual reference</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            plnBlue: '#00A2E9',
            plnDark: '#005b82',
            plnTeal: '#00B4CB',
            plnYellow: '#FFF000',
            plnRed: '#ED1C24'
          }
        }
      }
    }
  </script>
  <style>
    .bg-pln-login {
      background: linear-gradient(135deg, rgba(0, 91, 130, 0.7) 0%, rgba(0, 162, 233, 0.5) 100%), url('../../../frontend/assets/bg_landing_page.png') no-repeat center center;
      background-size: cover;
    }
    .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden bg-gray-50">
  <div id="login-section" class="h-screen w-full flex items-center justify-center bg-pln-login relative overflow-hidden">
    <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl p-8 relative z-10 mx-4 border border-white/50">
      <div class="text-center mb-6">
        <img src="../../../frontend/assets/logo_pln.png" alt="Logo PLN" class="h-32 mx-auto mb-4 object-contain transition-all" id="form-logo">
        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">SIGAP</h1>
        <p class="text-sm text-gray-500 mt-1" id="form-subtitle">Sistem Informasi Gardu & Analisis Pelanggan</p>
        <div class="mt-3 inline-block px-3 py-1 bg-blue-50 text-plnBlue text-xs font-semibold rounded-full border border-blue-100">ULP Labuhan</div>
      </div>
      <div id="form-login" class="fade-in">
        <form class="space-y-5" onsubmit="event.preventDefault()">
          <div>
            <label for="idadmin" class="block text-sm font-medium text-gray-700 mb-1">ID Admin</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-regular fa-id-badge text-gray-400"></i></div>
              <input type="text" id="idadmin" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-plnBlue focus:border-plnBlue outline-none transition-all text-sm" placeholder="Masukkan ID Admin" required>
            </div>
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-gray-400"></i></div>
              <input type="password" id="password" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-plnBlue focus:border-plnBlue outline-none transition-all text-sm" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="w-full bg-plnBlue hover:bg-plnDark text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-300">Masuk ke Sistem <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i></button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
